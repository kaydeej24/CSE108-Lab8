<!DOCTYPE html>
<html>
<head>
    <title>Course Grades</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6fa;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #2f5aa8;
            color: white;
        }

        input {
            width: 60px;
        }

        button {
            background: #2f5aa8;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>{{ course.name }}</h2>
    <p><b>Teacher:</b> {{ course.teacher.name }}</p>

    <h3>Students & Grades</h3>

    <!-- ONE FORM for all updates -->
    <form method="POST">
        <table>
            <tr>
                <th>Name</th>
                <th>Grade</th>
            </tr>

            {% for e in course.enrollments %}
            <tr>
                <td>{{ e.student.name }}</td>

                <td>
                    <input 
                        name="grade_{{ e.id }}" 
                        value="{{ e.grade or '' }}"
                        placeholder="{{e.grade}}"
                    >
                </td>
            </tr>
            {% endfor %}
        </table>

        <br>
        <button type="submit">Save Grades</button>
    </form>
    <br>
    <a href="/teacher"> <button> Back to dashboard </button> </a>
</div>

</body>
</html>
